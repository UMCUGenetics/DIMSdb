[project]
name = "dimsdb"
version = "0.1.0"
description = "Database for storing DIMS data"
readme = "README.md"
requires-python = ">=3.11.11"


dependencies = [
    "alembic>=1.18.4",
    "anyio>=4.3.0",
    "click>=8.2.1",
    "fastapi>=0.115.0",
    "gunicorn>=22.0.0",
    "mysql-connector-python>=8.4.0",
    "pandas>=2.2.2",
    "pydantic>=2.11,<3.0",
    "pyreadr>=0.5.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rdata>=1.0.0",
    "sqlalchemy>=2.0.30,<3.0",
    "sqlmodel>=0.0.38",
    "starlette>=0.37.2",
    "typer>=0.12.0",
    "typing-extensions>=4.14.0",
    "uvicorn[standard]>=0.30.0",
    "watchfiles>=0.23.0",
    "websockets>=13.0",
]


[project.scripts]
dimsdb = "dimsdb.cli:cli"

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[tool.ruff]
line-length = 127

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]
